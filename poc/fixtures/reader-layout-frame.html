<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自作番号試料 — Kindle接続なし</title>
  <link rel="stylesheet" href="/reader-layout-frame.css">
</head>
<body>
  <main id="readerSurface">
    <div id="zeroBox"><div id="contentsBox"><canvas id="pageSurface" width="1100" height="900" role="img" aria-label="大きな自作番号画像"></canvas></div></div>
    <div id="readerChromeTitle">匿名の自作試料タイトル</div>
    <div id="readerToolbar" aria-label="自作表示ツールバー">表示ツール</div>
    <nav id="readerControls" aria-label="自作位置操作">
      <button id="previous" type="button" aria-label="前のページへ">→</button>
      <input id="position" type="range" min="1" max="12" value="7" aria-label="現在位置">
      <button id="next" type="button" aria-label="次のページへ">←</button>
    </nav>
  </main>
</body>
</html>
