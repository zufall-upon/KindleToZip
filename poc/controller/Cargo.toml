[package]
name = "ktz-g02-controller"
version = "0.1.0"
authors = ["zufall-upon"]
license = "GPL-3.0-only"
repository = "https://github.com/zufall-upon/KindleToZip"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
png = "=0.17.16"
sha2 = "=0.10.9"
jpeg-decoder = { version = "=0.3.2", default-features = false }
jpeg-encoder = "=0.6.1"
