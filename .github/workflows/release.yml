name: Draft Windows and Ubuntu release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag pointing to the current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'zufall-upon/KindleToZip' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source tag and version
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid version tag' }
          $revision = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Tag must point to the workflow main commit' }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($package.version)") { throw 'Tag and package version differ' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/install-rust.ps1 -FetchDependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/toolchains/cargo/bin/cargo.exe fetch --manifest-path poc/launcher/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
           node scripts/install-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
           node scripts/install-browser.mjs --headed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust and IPC tests
        run: ./scripts/test-rust.ps1
      - name: Public source UI regressions
        run: npm test
      - name: Deployment regressions
        run: npm run test:distribution
      - name: Build portable executable
        run: npm run dist:build
      - name: Packaged public selection and export regressions
        run: node scripts/test-distribution.mjs --latest-portable
      - name: Collect release files and notices
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG -SourceCommit $env:GITHUB_SHA -WorkflowRun $env:GITHUB_RUN_ID
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-candidate
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-linux:
    if: github.repository == 'zufall-upon/KindleToZip' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/rust-target
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source tag and version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          cargo fetch --manifest-path poc/controller/Cargo.toml --locked
          npx playwright install-deps chromium
          sudo apt-get install -y xvfb
          node scripts/install-browser.mjs
          node scripts/install-browser.mjs --headed
      - name: Rust and IPC tests
        run: |
          cargo test --manifest-path poc/controller/Cargo.toml --locked --offline
          cargo build --manifest-path poc/controller/Cargo.toml --locked --offline
          npm run test:store
      - name: Public source UI regressions
        run: node scripts/diagnose-test-lifetime.mjs full
      - name: Linux bundle regressions
        run: npm run test:linux
      - name: Build and package Ubuntu portable
        run: |
          node scripts/build-linux-distribution.mjs --output "$RUNNER_TEMP/ktz-bundle" --ubuntu-portable
          node scripts/package-linux-release.mjs "$RUNNER_TEMP/ktz-bundle" "$RELEASE_TAG" "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Extracted public capture and export regression
        run: node scripts/test-linux-distribution.mjs "release-linux/KindleToZip-Portable-$RELEASE_TAG-linux-x64.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-candidate
          path: release-linux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft:
    needs: [build, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-candidate
          path: release
      - name: Verify transferred files
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release-candidate
          path: release-linux
      - name: Verify transferred Linux archive
        working-directory: release-linux
        run: sha256sum --check SHA256SUMS-linux.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            release/*.zip
            release/package/KindleToZip-Portable.exe
            release-linux/*.tar.gz
            release-linux/ktz-g02-controller
      - name: Create draft without publishing or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" release/KindleToZip-build.sigstore.json
          cat > release-notes.md <<'NOTES'
          Windows x64 and Ubuntu x64 portable packages.

          Built from the same tagged source on GitHub Actions Windows and Ubuntu runners. Windows: ZIP and SHA256SUMS.txt. Ubuntu: tar.gz and SHA256SUMS-linux.txt. Build metadata and notices are included in each archive.

          Ubuntu real-reader use requires a supported Chromium Snap and Wayland desktop. Hosted Linux checks cover the bundled anonymous reader, capture, crop and ZIP, not Snap authentication or all books. See docs/ubuntu-portable.ja.md.

          The ZIP includes license and notice files. Login profiles and captured book content are not included. Keep runtime/, data/, and temp/ private after launch.

          Verification instructions: docs/releasing.md at the tagged source revision.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md release/*.zip release/SHA256SUMS.txt release/KindleToZip-build.sigstore.json release-linux/*.tar.gz release-linux/SHA256SUMS-linux.txt
